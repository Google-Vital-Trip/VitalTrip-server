spring:
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - email
              - profile
            redirect-uri: ${GOOGLE_CALLBACK_URI}

app:
  oauth2:
    authorized-redirect-uri: ${FRONTEND_REDIRECT_URI}
