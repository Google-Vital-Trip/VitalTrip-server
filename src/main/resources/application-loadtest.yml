spring:
  datasource:
    url: jdbc:mysql://db:3306/vitaltrip?characterEncoding=UTF-8&connectionTimeZone=Asia/Seoul
    username: root
    password: ${MYSQL_ROOT_PASSWORD}

  flyway:
    enabled: true

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  security:
    oauth2:
      client:
        registration:
          google:
            redirect-uri: http://localhost:8080/login/oauth2/code/google

auth:
  cookie:
    domain: ""
    secure: false
    same-site: Lax

app:
  oauth2:
    authorized-redirect-uri: http://localhost:3000/auth/callback

server:
  tomcat:
    mbeanregistry:
      enabled: true

logging:
  level:
    com.vitaltrip.vitaltrip: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: INFO

management:
  server:
    port: 9090
  endpoints:
    web:
      exposure:
        include: health,info,metrics,threaddump,heapdump,loggers
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
