# 원문 중 제외한 권고
# - 뇌진탕 3문항 선별 질문 (GPP): 처치자 판단 도구라 신호 목록으로 대체
# - 목 보호대를 채우지 말 것 (약한 권고 *): 여행자가 가지고 있을 가능성이 낮음
# - 턱 밀어 올리기 (Spinal injury): 일반인용이 아니어서 머리 젖히고 턱 들기만 사용
# - 골반 골절 처치 (Spinal injury): 원문도 알아보려면 별도 교육이 필요하다고 함

id: HEAD_INJURY
version: 1

keyAction:
  ko: 하던 활동을 멈추게 하고, 뇌진탕이나 뇌 손상 신호가 나타나는지 지켜보세요.
  en: ""

steps:
  - text:
      ko: 하던 일을 멈추고 쉬게 하세요.
      en: ""
    source: ifrc2025-head
  - text:
      ko: 반응과 숨쉬기에 변화가 없는지 지켜보세요. 심한 머리 부상 신호는 바로 나타날 수도 있지만 몇 시간에서 며칠 뒤에 나타날 수도 있어요. 가장 중요한 건 평소와 달라진 점이 있는지예요.
      en: ""
    source: ifrc2025-head
  - text:
      ko: 높은 곳에서 떨어지거나 세게 부딪혔다면 목이나 등뼈도 다쳤을 수 있다고 생각하세요.
      en: ""
    source: ifrc2025-head

branches:
  - condition:
      ko: 높은 곳에서 떨어지거나 교통사고 등으로 목·등을 다쳤을 수 있고, 의식은 없지만 숨은 정상적으로 쉰다면
      en: ""
    steps:
      - text:
          ko: 발견한 자세 그대로 두세요.
          en: ""
        source: ifrc2025-spinal
      - text:
          ko: 이마를 뒤로 젖히고 턱을 들어 숨길을 연 뒤, 그 자세에서 머리가 움직이지 않게 손으로 부드럽게 받쳐 주세요.
          en: ""
        source: ifrc2025-spinal
      - text:
          ko: "{emergencyNumber}에 전화해 안내를 따르고, 숨쉬기와 반응에 변화가 없는지 계속 지켜보세요."
          en: ""
        source: ifrc2025-spinal

  - condition:
      ko: "잠깐이라도 의식을 잃었거나, 공격적이거나 말이 어눌하거나 경련을 하거나, 팔다리가 저리거나 균형을 잡지 못하거나, 눈이 부시거나 흐리거나 겹쳐 보이거나, 코·귀·입에서 피나 맑은 액체가 나오거나, 두 번 이상 토했다면 (심한 머리 부상)"
      en: ""
    steps:
      - text:
          ko: 바로 {emergencyNumber}에 전화하세요.
          en: ""
        source: ifrc2025-head
      - text:
          ko: 안심시키면서 머리와 목을 최대한 움직이지 않게 하세요. 누워 있다면 손이나 무릎으로 머리를 받쳐 움직이지 않게 할 수 있어요.
          en: ""
        source: ifrc2025-head
      - text:
          ko: 구급대가 올 때까지 반응과 숨쉬기를 계속 확인하세요.
          en: ""
        source: ifrc2025-head

  - condition:
      ko: 높은 곳에서 떨어지거나, 교통사고를 당했거나, 얕은 물에 머리부터 뛰어들었거나, 목·등이 아프거나 팔다리가 저리거나 힘이 빠진다면 (척추 손상 의심)
      en: ""
    steps:
      - text:
          ko: "{emergencyNumber}에 전화하세요."
          en: ""
        source: ifrc2025-spinal
      - text:
          ko: 의식이 또렷하면 안심시키고 최대한 움직이지 말라고 하세요. 아이이거나, 의식이 흐리거나, 말을 따르지 못하면 머리를 부드럽게 받쳐 목과 등이 움직이지 않게 해 주세요.
          en: ""
        source: ifrc2025-spinal
      - text:
          ko: 위험한 곳이 아니라면 옮기지 마세요. 꼭 옮겨야 한다면 두 명 이상이 함께하고, 한 명은 머리가 등뼈와 일직선이 되게 잡아 주세요.
          en: ""
        source: ifrc2025-spinal
      - text:
          ko: 쇼크를 줄이기 위해 체온이 떨어지지 않게 해 주세요.
          en: ""
        source: ifrc2025-spinal

  - condition:
      ko: 혹이 나거나, 가벼운 두통이나 메스꺼움 정도라면
      en: ""
    steps:
      - text:
          ko: 쉬게 하고, 뺨이 찢어진 것 같은 작은 상처는 처치해 주세요.
          en: ""
        source: ifrc2025-head
      - text:
          ko: 뇌진탕은 몇 시간에서 며칠에 걸쳐 나타날 수 있어요. 앞으로 24시간 동안 심한 머리 부상 신호가 생기지 않는지 계속 지켜보세요.
          en: ""
        source: ifrc2025-head

donts:
  - text:
      ko: 목과 머리를 끈이나 테이프로 묶어 고정하지 마세요.
      en: ""
    source: ifrc2025-spinal
  - text:
      ko: 머리 부상 증상이 완전히 사라지기 전에는 운전, 기계 작업, 몸싸움이 있는 운동을 하지 마세요.
      en: ""
    source: ifrc2025-head

accessHelp:
  - text:
      ko: 심한 머리 부상 신호가 하나라도 있으면 바로 {emergencyNumber}에 전화하세요.
      en: ""
    source: ifrc2025-head
  - text:
      ko: 진통제를 먹었는데도 심한 두통이 2시간 넘게 계속되면 바로 {emergencyNumber}에 전화하세요.
      en: ""
    source: ifrc2025-head
  - text:
      ko: 목이나 등뼈를 다친 것 같으면 항상 {emergencyNumber}에 전화하세요.
      en: ""
    source: ifrc2025-spinal

sources:
  ifrc2025-head:
    title: IFRC International First Aid, Resuscitation and Education Guidelines 2025
    section: Head injury and concussion
    page: 312
    url: https://www.ifrc.org/document/ifrc-international-first-aid-resuscitation-and-education-guidelines-2025
  ifrc2025-spinal:
    title: IFRC International First Aid, Resuscitation and Education Guidelines 2025
    section: Spinal injury
    page: 307
    url: https://www.ifrc.org/document/ifrc-international-first-aid-resuscitation-and-education-guidelines-2025
