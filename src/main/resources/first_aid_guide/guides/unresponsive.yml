id: UNRESPONSIVE
version: 1

keyAction:
  ko: 불러도 반응이 없으면 숨을 확인하고, 숨이 없거나 이상하면 바로 가슴을 누르기 시작하세요.
  en: ""

steps:
  - text:
      ko: 주변이 안전한지 먼저 확인하세요. 차가 다니거나 불, 전기 등 위험이 있으면 가까이 가지 마세요.
      en: ""
    source: ifrc2025-general
  - text:
      ko: 어깨를 가볍게 두드리며 "괜찮으세요?"라고 크게 물어보세요.
      en: ""
    source: ifrc2025-unresponsive-breathing
  - text:
      ko: 반응이 없으면 주변에 큰 소리로 도움을 요청하고 {emergencyNumber}에 전화하세요. 혼자라면 휴대폰을 스피커폰으로 켜고 옆에 두세요.
      en: ""
    source: ifrc2025-cpr-adult
  - text:
      ko: 이마를 뒤로 젖히고 턱을 들어 올린 뒤, 10초 안에 숨을 쉬는지 확인하세요. 가슴이 오르내리는지 보고, 숨소리를 듣고, 뺨에 숨이 닿는지 느껴보세요.
      en: ""
    source: ifrc2025-unresponsive-breathing
  - text:
      ko: 숨을 헐떡이거나 불규칙하게 쉬는 건 정상 호흡이 아니에요. 정상인지 확실하지 않으면 숨을 안 쉬는 것으로 보고 다음 단계로 가세요.
      en: ""
    source: ifrc2025-cpr-adult

branches:
  - condition:
      ko: 숨을 쉬지 않거나, 헐떡이거나, 정상인지 확실하지 않다면
      en: ""
    steps:
      - text:
          ko: 가슴 한가운데에 한 손바닥 아래쪽(손꿈치)을 대고, 다른 손을 그 위에 겹치세요.
          en: ""
        source: ifrc2025-cpr-adult
      - text:
          ko: 팔을 펴고 약 5cm 깊이로, 1분에 100~120회 빠르기로 세게 누르세요. 누른 뒤에는 가슴이 완전히 올라오도록 손에 기대지 마세요.
          en: ""
        source: ifrc2025-cpr-adult
      - text:
          ko: 인공호흡을 할 수 있다면 가슴 압박 30회 후 인공호흡 2회를 반복하세요. 할 수 없거나 꺼려지면 가슴 압박만 계속해도 돼요.
          en: ""
        source: ifrc2025-cpr-adult
      - text:
          ko: 근처에 자동심장충격기(AED)가 있으면 다른 사람에게 가져다 달라고 하세요. 도착하면 전원을 켜고 음성 안내를 따르세요.
          en: ""
        source: ifrc2025-cpr-adult
      - text:
          ko: 구급대가 오거나, 기침하거나 눈을 뜨거나 움직이며 정상적으로 숨을 쉴 때까지 멈추지 마세요. 도와줄 사람이 있으면 2분마다 교대하세요.
          en: ""
        source: ifrc2025-cpr-adult
      - text:
          ko: 깨어나더라도 다시 숨이 멈출 수 있으니 구급대가 올 때까지 곁에서 지켜보세요.
          en: ""
        source: ifrc2025-cpr-adult

  - condition:
      ko: 아이(사춘기 이전)가 숨을 쉬지 않거나 이상하게 쉰다면
      en: ""
    steps:
      - text:
          ko: 가슴 한가운데를 1분에 100~120회 빠르기로 30회 누르세요.
          en: ""
        source: ifrc2025-cpr-child
      - text:
          ko: 인공호흡 2회를 하세요. 아기는 입과 코를 함께, 아이는 입에 숨을 1초 동안 불어 넣어 가슴이 올라오는지 확인하세요.
          en: ""
        source: ifrc2025-cpr-child
      - text:
          ko: 가슴 압박 30회와 인공호흡 2회를 구급대가 오거나 아이가 정상적으로 숨을 쉴 때까지 반복하세요. 인공호흡을 할 수 없으면 가슴 압박만 계속하세요.
          en: ""
        source: ifrc2025-cpr-child
      - text:
          ko: 혼자인데 스피커폰을 쓸 수 없다면 1분 동안 심폐소생술을 한 뒤 전화하세요.
          en: ""
        source: ifrc2025-cpr-child

  - condition:
      ko: 숨을 정상적으로 쉬고 있다면
      en: ""
    steps:
      - text:
          ko: 몸을 옆으로 돌려 눕히고 머리를 뒤로 살짝 젖혀 숨길을 열어 두세요. 혀가 숨길을 막거나 토사물이 기도로 넘어가는 걸 막아줘요.
          en: ""
        source: ifrc2025-unresponsive-breathing
      - text:
          ko: 임신한 사람이라면 왼쪽으로 눕혀 주세요.
          en: ""
        source: ifrc2025-unresponsive-breathing
      - text:
          ko: 숨과 반응을 계속 지켜보세요. 숨이 멈추거나 헐떡이기 시작하면 곧바로 반듯이 눕히고 가슴 압박을 시작하세요.
          en: ""
        source: ifrc2025-unresponsive-breathing

  - condition:
      ko: 숨은 정상인데 떨어지거나 교통사고 등으로 목이나 등을 다쳤을 수 있다면
      en: ""
    steps:
      - text:
          ko: 몸을 옆으로 돌리지 말고 그대로 둔 채, 이마를 뒤로 젖히고 턱을 들어 숨길만 열어 두세요.
          en: ""
        source: ifrc2025-unresponsive-breathing
      - text:
          ko: 구급대가 오기까지 오래 걸리고 도와줄 사람이 있다면, 머리와 목, 몸이 일직선을 유지하도록 함께 옆으로 돌려 눕히세요.
          en: ""
        source: ifrc2025-unresponsive-breathing

donts:
  - text:
      ko: 맥박을 찾느라 시간을 쓰지 마세요. 숨을 정상적으로 쉬는지만 보면 돼요.
      en: ""
    source: ifrc2025-cpr-adult
  - text:
      ko: 잘못할까 봐 가슴 압박을 망설이지 마세요. 확실하지 않아도 시작하는 게 더 안전해요.
      en: ""
    source: ifrc2025-cpr-adult
  - text:
      ko: 단단한 바닥으로 옮기느라 가슴 압박 시작을 늦추지 마세요.
      en: ""
    source: ifrc2025-cpr-adult

accessHelp:
  - text:
      ko: 숨을 정상적으로 쉬더라도 의식이 없으면 항상 {emergencyNumber}에 연락하세요.
      en: ""
    source: ifrc2025-unresponsive-breathing
  - text:
      ko: 통화할 때 "의식이 없고 숨을 제대로 쉬지 않는다"고 분명히 말하세요. 구급대가 출동 순서를 정하는 데 가장 중요한 정보예요.
      en: ""
    source: ifrc2025-cpr-adult
  - text:
      ko: 쓰러진 원인(머리 부딪힘, 당뇨, 약물 등)을 알고 있다면 함께 알려 주세요.
      en: ""
    source: ifrc2025-unresponsive-breathing

sources:
  ifrc2025-general:
    title: IFRC International First Aid, Resuscitation and Education Guidelines 2025
    section: General approach
    page: 114
    url: https://www.ifrc.org/document/ifrc-international-first-aid-resuscitation-and-education-guidelines-2025
  ifrc2025-unresponsive-breathing:
    title: IFRC International First Aid, Resuscitation and Education Guidelines 2025
    section: Unresponsive and breathing normally
    page: 152
    url: https://www.ifrc.org/document/ifrc-international-first-aid-resuscitation-and-education-guidelines-2025
  ifrc2025-cpr-adult:
    title: IFRC International First Aid, Resuscitation and Education Guidelines 2025
    section: Unresponsive and abnormal breathing (adolescent and adult)
    page: 158
    url: https://www.ifrc.org/document/ifrc-international-first-aid-resuscitation-and-education-guidelines-2025
  ifrc2025-cpr-child:
    title: IFRC International First Aid, Resuscitation and Education Guidelines 2025
    section: Unresponsive and abnormal breathing (baby and child)
    page: 186
    url: https://www.ifrc.org/document/ifrc-international-first-aid-resuscitation-and-education-guidelines-2025
